<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bassant💖</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:wght@300;400&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cinema-pink: #ff69b4;
            --pink-glow: #ff1493;
            --pink-light: #ffb6c1;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0c0c0c, #1a1a1a, #000);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* نجوم ثابتة بدون حركة */
        .stars {
            position: absolute;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(2px 2px at 20px 30px, #ffb6c1, transparent),
                radial-gradient(2px 2px at 40px 70px, #ff69b4, transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, #ff1493, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
        }

        .container {
            background: rgba(0, 0, 0, 0.9);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 
                0 0 50px var(--pink-glow),
                inset 0 0 50px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 105, 180, 0.3);
            text-align: center;
            max-width: 400px;
        }

        .logo {
            font-family: 'Cinzel', serif;
            font-size: 3.5em;
            font-weight: 700;
            background: linear-gradient(45deg, var(--cinema-pink), var(--pink-light));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 20px;
            text-shadow: 0 0 25px rgba(255, 105, 180, 0.6);
        }

        .subtitle {
            color: #ccc;
            font-size: 1.2em;
            margin-bottom: 40px;
        }

        .password-input {
            width: 100%;
            padding: 18px;
            font-size: 1.3em;
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,105,180,0.4);
            border-radius: 12px;
            color: #fff;
            text-align: center;
            margin-bottom: 20px;
        }

        .password-input:focus {
            outline: none;
            border-color: var(--cinema-pink);
            box-shadow: 0 0 15px rgba(255,105,180,0.4);
        }

        .enter-btn {
            width: 100%;
            padding: 15px;
            font-size: 1.2em;
            font-weight: bold;
            background: linear-gradient(45deg, var(--cinema-pink), var(--pink-light));
            color: #000;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .enter-btn:hover {
            opacity: 0.9;
        }

        .hint {
            color: rgba(255,105,180,0.6);
            font-size: 0.9em;
            margin-top: 10px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

<div class="stars"></div>

<div class="container">
    <h1 class="logo">🌟 Bassant</h1>
    <p class="subtitle">أدخل تاريخ ميلادك 🔐</p>

    <input 
        type="password" 
        class="password-input" 
        placeholder="شاهد و استمتع" 
        id="passwordInput"
    >

    <div class="hint">تلميح: الباسورد بالانجليزي 🌝</div>

    <button class="enter-btn" onclick="checkPassword()">
        🎬 يلا بينا
    </button>

    <div id="successMessage" class="hidden">
        <h2 style="color:#ff1493;">🎉 تم الدخول بنجاح!</h2>
        <p style="color:#ffb6c1;">جاري التحويل...</p>
    </div>
</div>

<script>
const correctPassword = "2512012";

function checkPassword() {
    const input = document.getElementById("passwordInput").value;

    if (input === correctPassword) {
        document.querySelector(".container").innerHTML = `
            <h2 style="color:#ff1493;">🎉 تم الدخول بنجاح!</h2>
            <p style="color:#ffb6c1;">جاري التحويل...</p>
        `;

        setTimeout(() => {
            window.location.href = "79999.html";
        }, 2000);

    } else {
        const field = document.getElementById("passwordInput");
        field.value = "";
        field.placeholder = "غلط! حاول تاني";
    }
}
</script>

</body>
</html>
