<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nada</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:wght@300;400&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --cinema-pink: #ff69b4;
            --pink-glow: #ff1493;
            --pink-light: #ffb6c1;
            --dark-pink: #c71585;
        }

        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0c0c0c 0%, #1a1a1a 50%, #000 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* تأثير النجوم المتحركة */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(2px 2px at 20px 30px, #ffb6c1, transparent),
                radial-gradient(2px 2px at 40px 70px, #ff69b4, transparent),
                radial-gradient(1px 1px at 90px 40px, #fff, transparent),
                radial-gradient(1px 1px at 130px 80px, #ff1493, transparent);
            background-repeat: repeat;
            background-size: 200px 100px;
            animation: none;
        }

        @keyframes sparkle {
            0% { transform: translateY(0px) rotate(0deg); }
            100% { transform: translateY(-100px) rotate(360deg); }
        }

        .container {
            background: rgba(0, 0, 0, 0.9);
            padding: 60px 40px;
            border-radius: 20px;
            box-shadow: 
                0 0 50px var(--pink-glow),
                inset 0 0 50px rgba(0, 0, 0, 0.8);
            border: 2px solid rgba(255, 105, 180, 0.3);
            text-align: center;
            max-width: 400px;
            position: relative;
            backdrop-filter: blur(10px);
        }

.logo {
    font-family: 'Cinzel', serif;
    font-size: 3.5em;
    font-weight: 700;
    background: linear-gradient(45deg, var(--cinema-pink), var(--pink-light), var(--cinema-pink));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 20px;
    text-shadow: 0 0 30px rgba(255, 105, 180, 0.6);
    animation: none;
}

        @keyframes glow {
            from { 
                text-shadow: 0 0 20px rgba(255, 105, 180, 0.5),
                           0 0 40px rgba(255, 105, 180, 0.3); 
            }
            to { 
                text-shadow: 0 0 40px rgba(255, 105, 180, 0.8),
                           0 0 60px rgba(255, 105, 180, 0.4),
                           0 0 80px rgba(255, 105, 180, 0.2); 
            }
        }

        .subtitle {
            color: #ccc;
            font-size: 1.2em;
            margin-bottom: 40px;
            letter-spacing: 2px;
        }

        .password-group {
            position: relative;
            margin-bottom: 30px;
        }

        .password-input {
            width: 100%;
            padding: 20px 25px;
            font-size: 1.5em;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 105, 180, 0.4);
            border-radius: 15px;
            color: #fff;
            text-align: center;
            letter-spacing: 5px;
            font-family: 'Roboto', sans-serif;
            font-weight: 300;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        .password-input:focus {
            outline: none;
            border-color: var(--cinema-pink);
            box-shadow: 0 0 25px rgba(255, 105, 180, 0.5);
            transform: scale(1.02);
        }

        .password-input::placeholder {
            color: rgba(255, 105, 180, 0.5);
            letter-spacing: 5px;
        }

        .enter-btn {
            width: 100%;
            padding: 18px;
            font-size: 1.3em;
            font-weight: 700;
            background: linear-gradient(45deg, var(--cinema-pink), var(--pink-light));
            color: #000;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Roboto', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            overflow: hidden;
        }

        .enter-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 35px rgba(255, 105, 180, 0.5);
        }

        .enter-btn:active {
            transform: translateY(-1px);
        }

        .scan-line {
            position: absolute;
            top: -100%;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--cinema-pink), transparent);
            animation: none;
        }

        @keyframes scan {
            0% { top: -100%; }
            50% { top: 50%; }
            100% { top: 100%; }
        }

        .success {
            background: linear-gradient(45deg, #ff1493, var(--cinema-pink));
            animation: successPulse 1s ease-in-out;
        }

        @keyframes successPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .hidden {
            display: none;
        }

        /* تلميح صغير لكلمة السر */
        .hint {
            color: rgba(255, 105, 180, 0.6);
            font-size: 0.9em;
            margin-top: 10px;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    
    <div class="container">
        <div class="scan-line"></div>
        <h1 class="logo">🌟 Nada</h1>
        <p class="subtitle"> Enter your birth date🔐</p>
        
        <div class="password-group">
            <input 
                type="password" 
                class="password-input" 
                placeholder="شاهد و استمتع" 
                id="passwordInput"
                maxlength="10"
            >
            <div class="hint">تلميح: الباسورد بالانجليزي 🌝</div>
        </div>
        
        <button class="enter-btn" onclick="checkPassword()">
            🎬 يلا بينا
        </button>
        
        <div id="successMessage" class="hidden">
            <h2 style="color: #ff1493; margin-top: 20px;">🎉 تم الدخول بنجاح!</h2>
            <p style="color: #ffb6c1; margin-top: 10px;">مشاهده ممتعه...</p>
        </div>
    </div>

    <script>
        const correctPassword = "822007"; // كلمة السر الجديدة
        const passwordInput = document.getElementById('passwordInput');
        const successMessage = document.getElementById('successMessage');
        const container = document.querySelector('.container');
        const enterBtn = document.querySelector('.enter-btn');

        function checkPassword() {
            const inputValue = passwordInput.value.trim();
            
            if (inputValue === correctPassword) {
                // نجح الدخول
                container.innerHTML = successMessage.innerHTML;
                container.classList.add('success');
                
                // صوت نجاح (اختياري)
                playSuccessSound();
                
                // إعادة توجيه بعد 2 ثانية
                setTimeout(() => {
                    ('🎥 مرحباً بك في السينما! 🌟');
                     window.location.href = "79999.html"; // أضف صفحتك هنا
                }, 2000);
            } else {
                // خطأ في كلمة السر
                passwordInput.style.borderColor = '#ff4444';
                passwordInput.style.boxShadow = '0 0 20px rgba(255, 68, 68, 0.4)';
                passwordInput.value = '';
                passwordInput.placeholder = 'غلط! جرب مرة كمان';
                
                setTimeout(() => {
                    passwordInput.style.borderColor = 'rgba(255, 105, 180, 0.4)';
                    passwordInput.style.boxShadow = 'none';
                    passwordInput.placeholder = 'ســيــنــمــا';
                }, 1500);
            }
        }

        // صوت نجاح بسيط (Web Audio API)
        function playSuccessSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.frequency.setValueAtTime(800, audioContext.currentTime);
            oscillator.frequency.exponentialRampToValueAtTime(1200, audioContext.currentTime + 0.1);
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.3);
            
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.3);
        }

        // الدخول بالضغط على Enter
        passwordInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                checkPassword();
            }
        });

        // تأثير الكتابة
        passwordInput.addEventListener('input', function() {
            this.style.borderColor = 'var(--cinema-pink)';
            this.style.boxShadow = '0 0 15px rgba(255, 105, 180, 0.3)';
        });

        
    </script>
</body>
</html>
